# ---------------------------------------------------------------------------
# Pre-registered OOS acceptance criteria (Phase 2D point 17) - fixed BEFORE
# looking at any OOS result.
# ---------------------------------------------------------------------------
oos_acceptance_criteria:
  n_signals_preferred_minimum: 50
  net_expectancy_r_must_exceed: 0.0
  profit_factor_must_exceed: 1.15
  positive_after_1_5x_cost_stress: "desired, not strictly required"
  cluster_bootstrap_median_expectancy_must_exceed: 0.0
  ci_not_catastrophically_wide: true  # judged qualitatively, no fixed numeric bound pre-registered
  max_single_symbol_pnl_share_pct: 25.0
  must_not_depend_on_a_single_market_regime: true
  insufficient_sample_rule: "if n_signals < 50, status = INSUFFICIENT_SAMPLE regardless of point estimates - no GO/STOP verdict permitted"
  outcomes: ["A_CONFIRMED_ENOUGH_FOR_PAPER_TRADING", "B_WEAK_UNCERTAIN_WAIT_FOR_MORE_DATA", "C_REJECT_CLOSE_BRANCH"]
